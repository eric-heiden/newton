name: MCP Windows CPU

on:
  workflow_dispatch:
  push:
    branches:
      - eric-heiden/newton-live-mcp
    paths:
      - .github/workflows/mcp_windows.yml
      - newton/_src/mcp/**
      - newton/mcp.py
      - newton/__init__.py
      - newton/_src/solvers/mujoco/solver_mujoco.py
      - newton/_src/solvers/mujoco/kernels.py
      - newton/tests/test_mcp*.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONFAULTHANDLER: "1"
      NEWTON_MCP_TEST_GL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.11.26"
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Record Windows and dependency versions
        shell: pwsh
        run: |
          "Runner OS: $env:RUNNER_OS; architecture: $env:RUNNER_ARCH; image: $env:ImageOS $env:ImageVersion" | Tee-Object -FilePath mcp-windows-cpu.log
          uv run --locked --python 3.12 --extra dev --extra sim --with mcp==1.26.0 python -c "import importlib.metadata as m; import platform; import sys; print(platform.platform()); print(sys.version); [print(f'{name}=={m.version(name)}') for name in ('newton', 'warp-lang', 'numpy', 'mujoco', 'mujoco-warp', 'mcp')]" 2>&1 | Tee-Object -FilePath mcp-windows-cpu.log -Append
          exit $LASTEXITCODE
      - name: Test MCP transport, SDK interoperability, and CPU observations
        shell: pwsh
        run: |
          uv run --locked --python 3.12 --extra dev --extra sim --with mcp==1.26.0 python -m unittest -v newton.tests.test_mcp newton.tests.test_mcp_observation 2>&1 | Tee-Object -FilePath mcp-windows-cpu.log -Append
          exit $LASTEXITCODE
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mcp-windows-cpu
          path: mcp-windows-cpu.log
          if-no-files-found: warn
          retention-days: 14
